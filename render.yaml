services:
  - type: web
    name: scalptrade
    runtime: python
    buildCommand: pip3 install --upgrade pip && pip3 install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: TRADING_MODE
        value: PAPER
      - key: HOST
        value: 0.0.0.0
