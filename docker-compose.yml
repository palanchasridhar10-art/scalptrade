version: '3.8'

services:
  autonomous-scalper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autonomous-scalper
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - TRADING_MODE=PAPER
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./storage:/app/storage
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
